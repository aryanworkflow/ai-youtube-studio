
name: AI YouTube Studio

on:
  workflow_dispatch:
    inputs:
      format:
        description: "Video format"
        required: true
        type: choice
        options:
          - shorts
          - explainer

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install video tools and voice
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install Pillow

      - name: Generate narrated video
        env:
          VIDEO_FORMAT: ${{ inputs.format }}
        run: python generate_video.py

      - name: Save video for review
        uses: actions/upload-artifact@v4
        with:
          name: youtube-video-preview
          path: output/
          if-no-files-found: error
          retention-days: 7
