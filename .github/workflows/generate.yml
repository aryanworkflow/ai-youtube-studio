
name: AI YouTube Studio

on:
  workflow_dispatch:
    inputs:
      format:
        description: "Video format"
        required: true
        type: choice
        options:
          - shorts
          - explainer

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg librsvg2-bin

      - name: Generate video
        run: |
          VIDEO_FORMAT="${{ inputs.format }}" python generate_video.py

      - name: Upload video for review
        uses: actions/upload-artifact@v4
        with:
          name: youtube-video-preview
          path: output/
          retention-days: 7
